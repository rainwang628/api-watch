<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>中转站监控</title>
<style>
  :root {
    --bg: #0f1115; --card: #171a21; --line: #242833; --fg: #e6e8ee;
    --dim: #8b93a5; --ok: #35c759; --warn: #f0a020; --err: #ff453a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.5 -apple-system, "SF Pro Text", "PingFang SC", sans-serif;
    padding: 16px 14px 40px; max-width: 680px; margin: 0 auto;
  }
  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px; }
  h1 { font-size: 17px; margin: 0; font-weight: 600; letter-spacing: .2px; }
  .meta { color: var(--dim); font-size: 12px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px; margin-bottom: 12px;
  }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .name { font-weight: 600; font-size: 15px; }
  .tag {
    font-size: 11px; color: var(--dim); border: 1px solid var(--line);
    padding: 1px 7px; border-radius: 999px; margin-left: 6px;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-right: 8px; }
  .ok { background: var(--ok); } .warn { background: var(--warn); } .err { background: var(--err); }
  .unknown { background: var(--dim); }
  .status { font-size: 12px; color: var(--dim); }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .kpi { background: #12151b; border-radius: 10px; padding: 8px 10px; }
  .kpi b { display: block; font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .kpi span { font-size: 11px; color: var(--dim); }
  .probes { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 6px; }
  .probe { font-size: 11.5px; padding: 3px 8px; border-radius: 8px; background: #12151b; color: var(--dim); }
  .probe.ok { color: var(--ok); } .probe.bad { color: var(--err); }
  .err-msg { color: var(--err); font-size: 12px; margin-top: 8px; word-break: break-all; }
  h2 { font-size: 13px; color: var(--dim); font-weight: 600; margin: 22px 0 8px; letter-spacing: .4px; }
  .ev { font-size: 12.5px; padding: 7px 0; border-bottom: 1px solid var(--line); display: flex; gap: 8px; }
  .ev:last-child { border-bottom: none; }
  .ev time { color: var(--dim); font-variant-numeric: tabular-nums; flex: none; }
  .ev.warn .msg { color: var(--warn); } .ev.error .msg { color: var(--err); }
  .empty { color: var(--dim); font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>中转站监控</h1>
  <div class="meta" id="meta">加载中…</div>
</header>
<div id="channels"></div>
<h2>最近事件</h2>
<div class="card" id="events"><div class="empty">暂无</div></div>

<script>
const token = new URLSearchParams(location.search).get('token') || '';
const $ = (id) => document.getElementById(id);
const fmtTime = (ts) => {
  if (!ts) return '—';
  const d = new Date(ts * 1000);
  return d.toLocaleTimeString('zh-CN', {hour12: false});
};
const ago = (ts) => {
  if (!ts) return '从未';
  const s = Math.max(0, Math.round(Date.now() / 1000 - ts));
  if (s < 60) return s + ' 秒前';
  if (s < 3600) return Math.round(s / 60) + ' 分钟前';
  if (s < 86400) return Math.round(s / 3600) + ' 小时前';
  return Math.round(s / 86400) + ' 天前';
};
const STATUS = {ok: ['ok', '正常'], degraded: ['warn', '能力下降'], down: ['err', '不可用'], unknown: ['unknown', '未探测']};

function render(data) {
  const box = $('channels');
  box.innerHTML = data.channels.map((c) => {
    const [cls, label] = STATUS[c.status] || STATUS.unknown;
    const caps = Object.entries(c.caps || {}).map(([k, v]) => {
      if (!v) return `<span class="probe">${k} 未测</span>`;
      return `<span class="probe ${v.ok ? 'ok' : 'bad'}">${k} ${v.ok ? '✓' : '✗'}</span>`;
    }).join('');
    const bal = c.balance && c.balance.quota != null
      ? Number(c.balance.quota).toFixed(2) : '—';
    return `<div class="card">
      <div class="row">
        <div><span class="dot ${cls}"></span><span class="name">${c.name}</span>
          <span class="tag">${(c.models || []).join(', ') || c.api}</span></div>
        <div class="status">${label}</div>
      </div>
      <div class="grid">
        <div class="kpi"><b>${c.p50_ms ?? '—'}</b><span>延迟 p50 (ms)</span></div>
        <div class="kpi"><b>${c.ok_rate_24h ?? '—'}%</b><span>24h 成功率</span></div>
        <div class="kpi"><b>${bal}</b><span>余额/额度</span></div>
      </div>
      <div class="probes">${caps}</div>
      ${c.last_error ? `<div class="err-msg">${c.last_error}</div>` : ''}
      <div class="status" style="margin-top:8px">上次探测 ${ago(c.last_ts)}</div>
    </div>`;
  }).join('');

  const evs = data.events || [];
  $('events').innerHTML = evs.length ? evs.map((e) =>
    `<div class="ev ${e.level}"><time>${fmtTime(e.ts)}</time><div class="msg">${e.channel} · ${e.message}</div></div>`
  ).join('') : '<div class="empty">暂无事件</div>';

  $('meta').textContent = '更新于 ' + fmtTime(data.generated_at);
}

async function tick() {
  try {
    const r = await fetch('/api/summary?token=' + encodeURIComponent(token), {cache: 'no-store'});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    render(await r.json());
  } catch (e) {
    $('meta').textContent = '获取失败：' + e.message;
  }
}
tick();
setInterval(tick, 15000);
</script>
</body>
</html>
